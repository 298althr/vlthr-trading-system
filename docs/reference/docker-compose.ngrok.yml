# VLTHR Dashboard — Standalone, does NOT touch existing engine containers
# Usage: docker compose -f docker-compose.ngrok.yml up --build

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg17
    container_name: vlthr-postgres
    environment:
      - POSTGRES_PASSWORD=your_postgres_password
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - vlthr_pgdata:/var/lib/postgresql/data
      - C:/Users/Sav/Documents/VLTHR/backups:/backups:ro
    networks:
      - vlthr-dashboard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  data-ingestion:
    build:
      context: C:/Users/Sav/Documents/VLTHR
      dockerfile: Dockerfile.scheduler
    container_name: vlthr-data-ingestion
    env_file:
      - C:/Users/Sav/Documents/VLTHR/.env
    environment:
      - DATA_ROOT=/engine/data
      - DB_URL=postgresql://postgres:your_postgres_password@postgres:5432/postgres
    volumes:
      # Engine root mounted for code + .env + data output.
      # NOT using :ro because Windows Docker Desktop has issues with
      # nested writable mounts under a read-only parent. Code is protected
      # by git; the container only writes to /engine/data.
      - C:/Users/Sav/Documents/VLTHR:/engine
    working_dir: /engine
    networks:
      - vlthr-dashboard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "data_scheduler.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: vlthr-dashboard-redis
    networks:
      - vlthr-dashboard-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vlthr-dashboard-backend
    ports:
      - "3002:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - PARQUET_DATA_ROOT=/data
      - ENGINE_ROOT=/engine
      - REDIS_URL=redis://redis:6379
      - ENGINE_URL=http://host.docker.internal:8001
      - DB_URL=postgresql://postgres:your_postgres_password@postgres:5432/postgres
    depends_on:
      - redis
      - postgres
    volumes:
      - C:/Users/Sav/Documents/VLTHR/data:/data:ro
      - C:/Users/Sav/Documents/VLTHR:/engine
    networks:
      - vlthr-dashboard-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vlthr-dashboard-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - vlthr-dashboard-net
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: vlthr-dashboard-ngrok
    command:
      - "http"
      - "frontend:80"
      - "--url"
      - "${NGROK_DOMAIN}"
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN}
    depends_on:
      - frontend
    networks:
      - vlthr-dashboard-net
    restart: unless-stopped

volumes:
  vlthr_pgdata:
    external: true
    name: vlthr_pgdata

networks:
  vlthr-dashboard-net:
    driver: bridge
    name: vlthr-dashboard-net
